server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — route everything to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprint-named build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Security headers ─────────────────────────────────────────────
    # X-Frame-Options: SAMEORIGIN (already present, kept for clarity)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Strict-Transport-Security — only effective behind HTTPS. Uncomment the
    # line below once the site is served over TLS (used by the edge proxy).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — important because several layout fields
    # (fonts/colors/background images) and user-supplied template names may be
    # interpolated into the DOM. Allows the app's Google Fonts CDN and the
    # Labelary preview endpoint while blocking eval and remote scripts.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.labelary.com; img-src 'self' data: blob: https://api.labelary.com https://*.supabase.co; connect-src 'self' https://api.labelary.com https://*.supabase.co http://*.supabase.co ws://*.supabase.co wss://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' blob:;" always;
}

