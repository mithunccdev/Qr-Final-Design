<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f4f4f5;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script type="module">
      import { QRStudioApp, PREBUILT_TEMPLATES } from "/src/index.ts";

      // Initialize Studio App with Prebuilt Templates & Schemas
      const app = document.getElementById("app");
      const studio = new QRStudioApp({
        mountElement: app,
        initialLayout: PREBUILT_TEMPLATES[0].layout
      });
    </script>
  </body>
</html>
